<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GingersAttic booth</title>
  <style>
    :root { color-scheme: light; }
    /* The site's pages are solid theme purple; the booth itself stays on its paper card. */
    html, body { margin: 0; background: #633761; }
    body { font-family: Georgia, "Times New Roman", serif; color: #fee6c4; }
    .credits { margin: 2px 4px 0; font: 12px/1.3 "Courier New", monospace; color: #fee6c4; text-align: right; }
    .credits a { display: inline-block; padding: 12px 4px; color: inherit; } /* 40 px tap target */
  </style>
</head>
<body>
  <!--
    Embedded on the Wix site: the page sends the booth via postMessage; the library ships with the app.
    Opened directly (no parent page): shows the demo booth, so it can be tried on localhost.
  -->
  <attic-booth library-src="data/library.json"></attic-booth>
  <p class="credits"><a href="CREDITS.md" target="_blank" rel="noopener">Photo credits</a></p>
  <script type="module">
    const el = document.querySelector('attic-booth');
    if (window.parent === window) {
      el.setAttribute('booth-src', 'data/demo-booth.json');
      el.setAttribute('demo', '');
    }
    // Define the element only now, so connectedCallback sees booth-src in standalone mode.
    await import('./src/attic-booth.js');
  </script>
</body>
</html>
