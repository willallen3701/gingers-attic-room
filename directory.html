<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GingersAttic booths</title>
  <style>
    :root { color-scheme: light; }
    html, body { margin: 0; min-height: 100%; background: #633761; }
    body { font-family: Georgia, "Times New Roman", serif; color: #fee6c4; }
  </style>
</head>
<body>
  <!--
    Embedded on the Wix "Booths" page: the page sends load-directory via postMessage.
    Opened directly (no parent page): shows sample booths and answers its own requests, so it can be tried on localhost.
    Standalone-only URL options (for demos and screenshots):
      ?tab=collection     open on My collection
      ?loggedIn=0         as a visitor who isn't logged in
      ?empty=1            no booths at all
      ?q=teacup           start with a search
      ?category=lighting  start with a category
      ?sort=number        updated | number | shuffle
  -->
  <!-- library-src: the room library the cards' room peeks are drawn with (it ships with the app, as in embed.html). -->
  <attic-directory library-src="data/library.json"></attic-directory>
  <script type="module">
    const el = document.querySelector('attic-directory');
    if (window.parent === window) {
      el.setAttribute('sample-src', 'data/sample-directory.json');
      el.setAttribute('sample-options', location.search.slice(1));
    }
    // Define the element only now, so connectedCallback sees sample-src in standalone mode.
    await import('./src/attic-directory.js');
  </script>
</body>
</html>
