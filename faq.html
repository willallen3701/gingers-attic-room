<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GingersAttic questions</title>
  <style>
    :root { color-scheme: light; }
    html, body { margin: 0; min-height: 100%; background: #633761; }
    body { font-family: Georgia, "Times New Roman", serif; color: #fee6c4; }
  </style>
</head>
<body>
  <!--
    Embedded on the Wix FAQ page: the questions ship with the app (data/faq.json); the page sends load-faq
    with the business email address and answers contact-send.
    Opened directly (no parent page): shows the questions and simulates sending.
    Standalone-only URL options: ?email=hello@example.com shows the "Email us at" line.
    faq.html#q-shipping opens that question.
  -->
  <attic-faq faq-src="data/faq.json"></attic-faq>
  <script type="module">
    await import('./src/attic-faq.js');
    const q = new URLSearchParams(location.search);
    if (window.parent === window && q.has('email')) document.querySelector('attic-faq').loadFaq({ businessEmail: q.get('email') });
  </script>
</body>
</html>
